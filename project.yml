name: AlarmApp
options:
  bundleIdPrefix: com.gktuoktay
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: tr
settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_LANGUAGE: tr
packages:
  AlarmAppCore:
    path: AlarmAppCore
targets:
  AlarmApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: AlarmApp-iOS
        excludes:
          - Info.plist
          - Sounds
      - path: AlarmApp-iOS/Sounds
        buildPhase: resources
        excludes:
          - SOUNDS.md
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gktuoktay.AlarmApp
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.0.6"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: AlarmApp-iOS/Info.plist
      properties:
        CFBundleDevelopmentRegion: tr
        CFBundleDisplayName: AlarmApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - tr
          - en
          - fr
          - es
          - ru
          - zh-Hans
          - ar
        LSRequiresIPhoneOS: true
        NSHealthShareUsageDescription: Erken uyanma sorusu için uyku analizine ihtiyaç duyulur. Veri cihazda kalır.
        NSHealthUpdateUsageDescription: AlarmApp sağlık verisi yazmaz; sistem formu için açıklama gereklidir.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: AlarmAppCore
      - target: AlarmApp-Watch
        embed: true
    entitlements:
      path: AlarmApp-iOS/AlarmApp-iOS.entitlements
  AlarmApp-Watch:
    type: application
    platform: watchOS
    sources:
      - path: AlarmApp-Watch
        excludes:
          - Info.plist
      - path: AlarmApp-iOS/Localizable.xcstrings
        buildPhase: resources
        optional: true
    info:
      path: AlarmApp-Watch/Info.plist
      properties:
        CFBundleDevelopmentRegion: tr
        CFBundleDisplayName: AlarmApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - tr
          - en
          - fr
          - es
          - ru
          - zh-Hans
          - ar
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gktuoktay.AlarmApp
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: Erken uyanma sorusu için uyku analizine ihtiyaç duyulur. Veri cihazda kalır.
        NSHealthUpdateUsageDescription: AlarmApp sağlık verisi yazmaz; sistem formu için açıklama gereklidir.
    dependencies:
      - package: AlarmAppCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gktuoktay.AlarmApp.watchkitapp
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.0.6"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.gktuoktay.AlarmApp
      INFOPLIST_KEY_WKApplication: YES
      TARGETED_DEVICE_FAMILY: "4"
      SKIP_INSTALL: NO
      SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: AlarmApp-Watch/AlarmApp-Watch.entitlements
