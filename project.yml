name: AlarmApp
options:
  bundleIdPrefix: com.gktuoktay
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
packages:
  AlarmAppCore:
    path: AlarmAppCore
targets:
  AlarmApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: AlarmApp-iOS
        excludes:
          - Info.plist
    dependencies:
      - package: AlarmAppCore
      - target: AlarmApp-Watch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gktuoktay.AlarmApp
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "0.0.4"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
  AlarmApp-Watch:
    type: application
    platform: watchOS
    sources:
      - path: AlarmApp-Watch
        excludes:
          - Info.plist
    info:
      path: AlarmApp-Watch/Info.plist
      properties:
        CFBundleDisplayName: AlarmApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gktuoktay.AlarmApp
        WKRunsIndependentlyOfCompanionApp: true
    dependencies:
      - package: AlarmAppCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gktuoktay.AlarmApp.watchkitapp
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "0.0.4"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.gktuoktay.AlarmApp
      INFOPLIST_KEY_WKApplication: YES
      TARGETED_DEVICE_FAMILY: "4"
      SKIP_INSTALL: NO
