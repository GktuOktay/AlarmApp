name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          swiftlint lint --strict || true
      - name: AlarmAppCore tests
        run: cd AlarmAppCore && swift test
